[project]
name = "rescueplan"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pymongo>=4.9,<5.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "python-dotenv>=1.0,<2.0"
]

[tool.vercel]
entrypoint = "backend.app.main:app"